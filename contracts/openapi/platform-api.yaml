openapi: 3.1.0
info:
  title: Enterprise Agent Platform API
  version: 0.1.0
paths:
  /api/agents:
    get:
      operationId: listAgents
      parameters:
        - {name: tenantId, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Agent definitions visible to the tenant
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentResponse'}
  /api/tasks:
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../json-schema/task-request.schema.json'}
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponse'}
  /api/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Task state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponse'}
  /api/tasks/{taskId}/events:
    get:
      operationId: streamTaskEvents
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Server-sent task events
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/TaskEventResponse'}
  /api/approvals:
    get:
      operationId: listApprovals
      parameters:
        - {name: tenantId, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApprovalResponse'}
  /api/approvals/{approvalId}:
    post:
      operationId: decideApproval
      parameters:
        - {name: approvalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '200':
          description: Approval decision accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalResponse'}
components:
  schemas:
    AgentResponse:
      type: object
      required: [agentId, name, version, status, capabilities]
      properties:
        agentId: {type: string}
        name: {type: string}
        version: {type: string}
        status: {type: string}
        capabilities: {type: array, items: {type: string}}
        tenantScope: {type: [string, 'null']}
    TaskResponse:
      type: object
      required: [taskId, traceId, tenantId, userId, status]
      properties:
        taskId: {type: string}
        traceId: {type: string}
        tenantId: {type: string}
        userId: {type: string}
        status: {type: string}
        output: {type: [object, 'null']}
        errorCode: {type: [string, 'null']}
    TaskEventResponse:
      type: object
      required: [eventId, taskId, traceId, eventType, payload, createdAt]
      properties:
        eventId: {type: string}
        taskId: {type: string}
        traceId: {type: string}
        eventType: {type: string}
        payload: {type: object}
        createdAt: {type: string, format: date-time}
    ApprovalDecisionRequest:
      type: object
      required: [tenantId, actor, decision]
      properties:
        tenantId: {type: string}
        actor: {type: string}
        decision: {enum: [APPROVE, REJECT]}
      additionalProperties: false
    ApprovalResponse:
      type: object
      required: [approvalId, taskId, tenantId, requestedBy, reason, status, expiresAt]
      properties:
        approvalId: {type: string}
        taskId: {type: string}
        tenantId: {type: string}
        requestedBy: {type: string}
        reason: {type: string}
        status: {type: string}
        expiresAt: {type: string, format: date-time}
        decidedBy: {type: [string, 'null']}
        decidedAt: {type: [string, 'null'], format: date-time}
