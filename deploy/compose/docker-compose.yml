services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: change-me-local-only
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  agent-platform:
    build:
      context: ../../java-platform
      dockerfile: ../deploy/docker/agent-platform.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_URL: jdbc:postgresql://postgres:5432/agent_platform
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    ports: ["8080:8080"]
volumes:
  postgres-data:
