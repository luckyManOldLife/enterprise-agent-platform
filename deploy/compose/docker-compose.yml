services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: change-me-local-only
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/schemas/V1__platform_core.sql:/docker-entrypoint-initdb.d/V1__platform_core.sql:ro
      - ../../database/migrations/V2__task_outbox.sql:/docker-entrypoint-initdb.d/V2__task_outbox.sql:ro
      - ../../database/migrations/V3__approvals.sql:/docker-entrypoint-initdb.d/V3__approvals.sql:ro
      - ../../database/migrations/V4__task_outbox_claim_lease.sql:/docker-entrypoint-initdb.d/V4__task_outbox_claim_lease.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7
    ports: ["6379:6379"]
  agent-platform:
    build:
      context: ../../java-platform
      dockerfile: ../deploy/docker/agent-platform.Dockerfile
    environment:
      PLATFORM_RUNTIME: postgres
      SERVER_HOST: 0.0.0.0
      POSTGRES_URL: jdbc:postgresql://postgres:5432/agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: change-me-local-only
      MODEL_AGENT_IDS: ${MODEL_AGENT_IDS:-supervisor}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8080:8080"]
  agent-worker:
    profiles: ["worker"]
    build:
      context: ../../java-platform
      dockerfile: ../deploy/docker/agent-worker.Dockerfile
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: change-me-local-only
      CLIPROXY_API_BASE_URL: ${CLIPROXY_API_BASE_URL:-http://infra-cli-proxy-api:8317/v1}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:-}
      CLIPROXY_MODEL: ${CLIPROXY_MODEL:-gpt-5.5}
      CLIPROXY_TIMEOUT_SECONDS: ${CLIPROXY_TIMEOUT_SECONDS:-30}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_POLL_INTERVAL_MILLIS: ${WORKER_POLL_INTERVAL_MILLIS:-1000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      MODEL_AGENT_IDS: ${MODEL_AGENT_IDS:-supervisor}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, cli-proxy]
volumes:
  postgres-data:
networks:
  cli-proxy:
    external: true
    name: ${EAP_CLIPROXY_NETWORK_NAME:-infra-stack_infra}
